[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "olist-cx-mcp"
version = "0.1.0"
description = "Servidor MCP somente leitura sobre avaliações da Olist classificadas por motivo"
requires-python = ">=3.11,<3.13"
license = "MIT"
# versões exatas ficam em requirements.txt
dependencies = ["mcp[cli]", "duckdb", "pydantic", "scikit-learn", "joblib", "python-dotenv"]

[project.scripts]
olist-cx-mcp = "olist_cx_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
